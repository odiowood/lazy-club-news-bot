name: AI 뉴스 발행

on:
  schedule:
    # 매일 오전 8시 (한국시간) = 전날 UTC 23:00
    # GitHub Actions는 UTC 기준이라 -9시간 해서 적습니다
    - cron: "0 23 * * *"
  workflow_dispatch:        # 깃허브 웹에서 수동 실행 버튼

permissions:
  contents: write           # seen.json을 다시 커밋하기 위해 필요

jobs:
  publish:
    runs-on: ubuntu-latest

    # 시크릿을 여기서 한 번 꺼내둡니다.
    # 아래 단계들의 if 조건에서 secrets 는 못 읽지만 env 는 읽을 수 있기 때문입니다.
    env:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      # 구독 토큰으로 인증할 때만 필요합니다.
      # API 키를 쓰는 경우엔 이 단계를 건너뜁니다.
      - name: 클로드 코드 설치
        if: env.CLAUDE_CODE_OAUTH_TOKEN != ''
        run: npm install -g @anthropic-ai/claude-code

      - name: 뉴스 발행
        run: python fetch_news.py

      - name: 발행 기록 저장
        run: |
          git config user.name  "lazy-club-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json
          # 변경이 없으면 커밋을 건너뛴다 (실패 처리하지 않음)
          git diff --staged --quiet || git commit -m "chore: 발행 기록 갱신"
          git push
